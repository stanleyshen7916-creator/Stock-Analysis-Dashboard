# Pipeline watchdog: every evening, checks that Cloud is at most one trading
# session behind (the local daytime run - log on and 18:00 - syncs it there)
# and opens an issue - e-mailed to the repo owner - when it is further behind;
# closes it on recovery. Runs in this public repo, where GitHub Actions
# minutes are free.
# Generated from Stock-Analysis-System/publish/dashboard-repo/ - do not edit here.
name: Pipeline watchdog

on:
  schedule:
    - cron: '0 12 * * *'   # 20:00 Taipei, after the 18:00 run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the pipeline data in Cloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node watchdog/check-pipeline.mjs
