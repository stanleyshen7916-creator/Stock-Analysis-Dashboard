<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 智慧選股｜修正版 Dashboard</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef2f5}
    iframe{display:block;width:100%;height:100%;border:0}
    .loading{position:fixed;inset:0;display:grid;place-items:center;font:600 18px system-ui,"Microsoft JhengHei",sans-serif;color:#40566b;background:#eef2f5;z-index:-1}
  </style>
</head>
<body>
  <div class="loading">載入 AI 智慧選股 Dashboard…</div>
  <iframe id="dashboard" src="./index.html" title="AI 智慧選股 Dashboard"></iframe>
  <script>
    const frame=document.getElementById('dashboard');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc) return;
      const style=doc.createElement('style');
      style.textContent=`
        body{font-size:16px!important}
        .nav button{font-size:15px!important;padding:10px 12px!important}
        .nav-label{font-size:13px!important}
        .nav-sub{font-size:14px!important}
        .brand strong{font-size:17px!important}
        .brand small{font-size:12px!important}
        .status-card{font-size:13px!important}
        .topbar h1{font-size:28px!important}
        .topbar p,.section-head p,.page-title p,.panel p{font-size:14px!important}
        .top-meta span,.badge{font-size:13px!important}
        .hero-title{font-size:15px!important}
        .hero-text{font-size:15px!important}
        .hero-number{font-size:44px!important}
        .signal-card h3{font-size:16px!important}
        .signal-row{font-size:13px!important}
        .data-big{font-size:38px!important}
        .section-head h2,.page-title h2{font-size:21px!important}
        .table-wrap table{font-size:13px!important}
        .table-wrap th,.table-wrap td{padding:10px!important}
        .change-item{font-size:13px!important}
        .clean{font-size:14px!important}
        .horizon b{font-size:13px!important}
        .horizon strong{font-size:29px!important}
        .horizon span{font-size:12px!important}
        .section-head button,.panel button,.search-card button,.form-card button{font-size:13px!important}
        .empty{font-size:14px!important}
        #page-dashboard .bottom-grid{grid-template-columns:1fr 1fr!important}
        #page-dashboard .bottom-grid > section:nth-child(2){display:none!important}
        @media(max-width:760px){
          #page-dashboard .bottom-grid{grid-template-columns:1fr!important}
          .topbar h1{font-size:24px!important}
        }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
