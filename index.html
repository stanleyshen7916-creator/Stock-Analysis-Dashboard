<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 智慧選股研究平台</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app" id="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="logo">AI</div><div><strong>AI 智慧選股研究平台</strong><small>AI Stock Selection System</small></div></div>
    <nav id="side-nav">
      <a data-route="overview" href="#/overview">⌂ <span>總覽 Dashboard</span></a>
      <div class="nav-group">
        <a data-route="observation" href="#/observation">🔥 <span>AI 觀察清單</span></a>
        <a class="sub" data-route="observation" data-horizon="DAY_TRADING" href="#/observation/DAY_TRADING"><span>當沖（0–1日）</span><i data-count="DAY_TRADING">–</i></a>
        <a class="sub" data-route="observation" data-horizon="SHORT_TERM" href="#/observation/SHORT_TERM"><span>短期（2週內）</span><i data-count="SHORT_TERM">–</i></a>
        <a class="sub" data-route="observation" data-horizon="SHORT_MEDIUM_TERM" href="#/observation/SHORT_MEDIUM_TERM"><span>短中期（3–6個月）</span><i data-count="SHORT_MEDIUM_TERM">–</i></a>
        <a class="sub" data-route="observation" data-horizon="MEDIUM_TERM" href="#/observation/MEDIUM_TERM"><span>中期（6–12個月）</span><i data-count="MEDIUM_TERM">–</i></a>
        <a class="sub" data-route="observation" data-horizon="MEDIUM_LONG_TERM" href="#/observation/MEDIUM_LONG_TERM"><span>中長期（12–36個月）</span><i data-count="MEDIUM_LONG_TERM">–</i></a>
        <a class="sub" data-route="observation" data-horizon="LONG_TERM" href="#/observation/LONG_TERM"><span>長期（36個月以上）</span><i data-count="LONG_TERM">–</i></a>
      </div>
      <a data-route="portfolio" href="#/portfolio">▣ <span>我的持股 Portfolio</span></a>
      <a data-route="stock" href="#/stock">⌁ <span>個股分析</span></a>
      <a data-route="compare" href="#/compare">⇄ <span>股票比較</span></a>
      <a data-route="market" href="#/market">▱ <span>市場分析</span></a>
      <a data-route="industry" href="#/industry">▧ <span>產業分析</span></a>
      <a data-route="strategy" href="#/strategy">⚙ <span>策略／參數</span></a>
      <a data-route="backtest" href="#/backtest">◫ <span>回測驗證 Backtest</span></a>
      <a data-route="selection-flow" href="#/selection-flow">◎ <span>AI 選股流程</span></a>
      <a data-route="historical" href="#/historical">◌ <span>資料中心</span></a>
      <a data-route="reports" href="#/reports">▤ <span>報告中心</span></a>
      <a data-route="settings" href="#/settings">⚙ <span>系統設定</span></a>
    </nav>
    <footer>v0.1.0　|　AI Selection Engine</footer>
  </aside>

  <div class="content-wrap">
    <header class="topbar">
      <div class="search" style="position:relative;">
        <input type="search" id="global-search" placeholder="⌕　搜尋股票：代號 / 公司名稱" autocomplete="off" />
        <div id="search-results" hidden></div>
      </div>
      <div id="auth-box">
        <span id="auth-status" class="notice" style="display:none; margin:0; padding:5px 10px;"></span>
        <form id="login-form" class="inline" style="margin:0; display:flex; gap:6px;">
          <input type="email" id="login-email" placeholder="Email" required />
          <input type="password" id="login-password" placeholder="密碼" required />
          <button type="submit" class="btn primary">登入</button>
          <button type="button" id="signup-btn" class="btn">註冊</button>
        </form>
        <button type="button" id="logout-btn" class="btn" hidden>登出</button>
      </div>
    </header>

    <main id="page-content">
      <div class="empty">載入中...</div>
    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
